name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Compile catalogue
        run: npm run catalogue:build

      - name: Compile learning content (sanitized)
        run: npm run learn:build

      - name: Validate RDF files
        run: npm run validate

      - name: Type check
        run: npx tsc -b

      - name: Accessibility — WCAG 2.1 AA contrast
        run: npm run test:a11y

      - name: Run tests
        run: npm test

      - name: Build
        run: npx vite build
