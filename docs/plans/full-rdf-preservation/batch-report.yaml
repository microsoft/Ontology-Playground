batch_id: "RDF-RISK-REBASE-02"
completed_tasks: ["T004", "T005", "T006", "T008", "T013", "T014"]
blocked_tasks: []

finding_disposition:
  - finding: "Standalone RDF/XML node roots lost rdf:about identity"
    status: "confirmed_fixed"
    root_cause: "The upstream parser processed RDF node attributes only when a parent tag existed."
    resolution: "The adapter supplies root node-element context, and the visual index includes the document element."
    evidence: "Independent dataset and mapped-edit export tests preserve the named subject and unrelated statements."
  - finding: "Unknown rdf:parseType values were parsed as resources"
    status: "confirmed_fixed"
    root_cause: "The dependency did not apply RDF/XML's unknown-value Literal fallback."
    resolution: "Unknown values are normalized internally to Literal while Resource, Collection, Literal, and RDF 1.2 Triple remain distinct."
    evidence: "Independent lexical-value and unrelated-edit export assertions pass."
  - finding: "Valid Unicode XML predicate starts could not be serialized"
    status: "confirmed_fixed"
    root_cause: "The writer used Unicode letter categories instead of XML 1.0 NCName ranges."
    resolution: "The linear reverse scan now uses complete numeric XML 1.0 NCName start and character ranges."
    evidence: "U+200C and U+E0001 predicate regressions parse, serialize, and canonicalize."
  - finding: "Arbitrary URL embeds bypassed RDF preflight and resource limits"
    status: "confirmed_fixed"
    root_cause: "The URL path buffered the response and called the visual parser directly."
    resolution: "Declared and streamed bytes are bounded to 8 MiB; oversized streams are cancelled; RDF/XML uses complete worker ingestion."
    evidence: "Unit tests cover declared/actual overflow, JSON compatibility, and DOCTYPE; native Chromium covers the emitted worker and pre-worker DOCTYPE rejection."
  - finding: "Late Designer entry and deep-link loads overwrote newer state"
    status: "confirmed_fixed"
    root_cause: "Async completions had only route-effect cleanup, not request generation or initiating-state identity."
    resolution: "Route/request generations plus app ontology, RDF identity, and Designer draft identity guard every completion."
    evidence: "Deferred navigation, active-ontology replacement, and deep-link draft replacement regressions pass."
  - finding: "RDF textarea edits during parsing were silently discarded"
    status: "confirmed_fixed"
    root_cause: "The submit button was disabled during parsing but the controlled textarea remained editable."
    resolution: "Submitted text is locked while parsing and its revision is verified before applying; cancellation remains enabled."
    evidence: "A deferred parser regression proves later typing cannot alter the submitted text."
  - finding: "Fabric submission silently projected away source-only RDF"
    status: "confirmed_fixed"
    root_cause: "Fabric APIs accept only the visual Ontology projection."
    resolution: "Source-backed Fabric entry points are disabled with a fidelity notice and the modal independently blocks API calls."
    evidence: "Import/export and Fabric modal regressions prove callbacks and APIs are not invoked."
  - finding: "Cross-origin embeds could not start the emitted RDF worker"
    status: "confirmed_fixed"
    root_cause: "The worker URL remained cross-origin relative to a page consuming the otherwise self-contained embed script."
    resolution: "The worker payload is inlined and launched from a consumer-origin Blob URL."
    evidence: "A native HTTPS fixture loads ontology-embed.js from a second origin and completes RDF worker parsing without requesting a worker script."
  - finding: "Large accepted sources crashed complete-source views"
    status: "confirmed_fixed"
    root_cause: "The highlighter spread more than 160,000 React token children and built an unbounded span tree."
    resolution: "Sources above 256,000 characters render as one complete plain-text node; smaller sources retain syntax highlighting."
    evidence: "Unit coverage proves bounded fallback and Chromium opens the complete 5.18 MB Brick source without a page error."
  - finding: "Standalone rdf:ID and empty rdf:about roots were absent from the visual projection"
    status: "confirmed_fixed"
    root_cause: "Projection extraction read only truthy rdf:about values."
    resolution: "A central identity resolver distinguishes absent and empty rdf:about, resolves rdf:ID, and exposes standalone rdf:nodeID roots read-only."
    evidence: "Independent projection and edited-export graph assertions cover rdf:ID, empty rdf:about, and blank-node roots."
  - finding: "File imports allocated oversized files and left obsolete readers active"
    status: "confirmed_fixed"
    root_cause: "The 8 MiB check ran only after FileReader produced the complete ArrayBuffer."
    resolution: "Declared file size is checked before reading and active readers are aborted on replacement, close, or unmount."
    evidence: "Regression tests prove no read begins for an oversized file and obsolete readers are aborted."
  - finding: "Async exports could download stale documents"
    status: "confirmed_fixed"
    root_cause: "Header, modal, and Designer download paths clicked links unconditionally after awaited loading or serialization."
    resolution: "Each path rechecks request generation, mount state, initiating ontology, and RDF document ID/revision before exposing output."
    evidence: "Deferred export tests replace each initiating document or draft and observe no anchor click."
  - finding: "Deployed CSP blocked the inline RDF worker"
    status: "confirmed_fixed"
    root_cause: "Blob workers fell back to script-src, which allowed only self."
    resolution: "The deployed policy now declares worker-src 'self' blob:."
    evidence: "Native Chromium imports RDF under the exact staticwebapp.config.json policy without a CSP or worker error."
  - finding: "Authored sharing could navigate after a stale clipboard write"
    status: "confirmed_fixed"
    root_cause: "The authored branch checked identity after encoding but not after awaiting clipboard completion."
    resolution: "Identity and mount state are rechecked immediately after clipboard completion and before history replacement."
    evidence: "Deferred clipboard tests cover both active-ontology replacement and Header unmount."
  - finding: "XML-literal markup entered the visual projection"
    status: "confirmed_fixed"
    root_cause: "Projection discovery traversed descendants of Literal and unknown rdf:parseType property elements as if their markup were live RDF/XML."
    resolution: "Every projection discovery helper excludes XML-literal descendants, imported projection mappings are retained only when backed by authoritative quads, and provenance requires an asserted owl:Ontology type."
    evidence: "Independent graph expectations prove the markup remains one XMLLiteral while projection and provenance targeting stay empty."
  - finding: "An empty source-backed projection offered authored templates"
    status: "confirmed_fixed"
    root_cause: "The template picker tested only projected entity and relationship counts."
    resolution: "Templates are offered only for an empty authored draft with no RDF document; source-only documents remain in complete RDF mode."
    evidence: "A source-only Designer regression retains document identity and confirms no template replacement control is rendered."
  - finding: "Header sharing and download could complete after route-only navigation"
    status: "confirmed_fixed"
    root_cause: "Async completion guards tracked component, ontology, and document identity but not route identity."
    resolution: "The initiating canonical route participates in every completion check and route changes invalidate the active request."
    evidence: "Deferred source-export and authored-clipboard regressions navigate without changing ontology state and expose no stale output."
  - finding: "Some large-ontology Designer entry paths bypassed the safety limit"
    status: "confirmed_fixed"
    root_cause: "Only Designer deep links applied the 1,000-element all-at-once editing threshold."
    resolution: "A shared scale policy now guards deep links, Header entry, and Gallery edit; oversized catalogue edit controls are disabled while viewing remains available."
    evidence: "Header and Gallery regressions prevent draft loading and Designer navigation at the threshold."
  - finding: "RDF property reification depended on XML attribute order"
    status: "confirmed_fixed"
    root_cause: "The upstream parser emitted Resource and Collection statements before a later rdf:ID attribute had initialized the reification target."
    resolution: "Property attributes are normalized into semantic processing order, with statement identity before parseType; empty collections emit their reified nil statement explicitly."
    evidence: "Independent expected reification quads cover Resource, non-empty Collection, and empty Collection in both attribute orders plus unrelated-label edited export."
  - finding: "Expanded IRIs could amplify a small source into excessive retained memory"
    status: "confirmed_fixed"
    root_cause: "Only source bytes and statement count were bounded; namespace expansion and deduplication keys had no term-memory budget."
    resolution: "Parsing now enforces a 16,384-character expanded IRI-like term limit and a 33,554,432-character cumulative retained term/key budget before insertion."
    evidence: "Focused regressions reject both one overlong term and a 2,500-statement namespace-amplification input while the 53,957-quad Brick artifact remains accepted."
  - finding: "Equivalent relative IRIs produced duplicate projected entities"
    status: "confirmed_fixed"
    root_cause: "Semantic projection indexes used raw rdf:about/resource spellings instead of resolved RDF term identity."
    resolution: "Class, property, domain/range, SHACL path, hasKey, and subclass indexes use RDF-resolved identity while preserving source spelling only for presentation IDs."
    evidence: "Thing and ./Thing under one base coalesce into one mapped entity without URL canonicalization."
  - finding: "A valid literal edit could make its next edit ambiguous"
    status: "confirmed_fixed"
    root_cause: "Each edit rediscovered a target from subject, predicate, and current lexical text alone."
    resolution: "Projection mappings retain the exact literal object and graph, including language and datatype, and advance that identity atomically with each patch."
    evidence: "An English label edited to collide with a French label remains editable and a second edit changes only the English statement."
  - finding: "Raw DOCTYPE scanning rejected inert character content"
    status: "confirmed_fixed"
    root_cause: "A case-insensitive substring search could not distinguish a declaration from text in comments or CDATA."
    resolution: "A bounded SAX prolog pass rejects the actual doctype token before root parsing while leaving inert text untouched."
    evidence: "Declaration preflight still precedes DOM/worker work; comment and CDATA literals containing the same text parse normally."
  - finding: "Projection authority validation scanned every quad for every mapping"
    status: "confirmed_fixed"
    root_cause: "Mapping validation used Array.some over the complete dataset per projected resource."
    resolution: "One quad-key set and one literal index serve constant-time authority and exact-literal lookups; visual entities and relationships are also indexed by ID."
    evidence: "A measured 3,000-mapping / 36,000-quad authority index-and-filter pass completed in 24.7 ms."
  - finding: "Duplicate statements bypassed expanded-term work limits"
    status: "confirmed_fixed"
    root_cause: "Expanded-term accounting occurred only when a deduplicated quad was retained, and visual DOM projection started concurrently with dataset validation."
    resolution: "Every emitted quad consumes a 250,000-emission and 67,108,864-character processed-term budget before key construction; bounded dataset parsing completes before visual projection begins."
    evidence: "A 10,000-emission long-IRI duplicate fixture rejects in 199.5 ms and a DOMParser spy proves projection never starts."
  - finding: "Nested xml:base split one RDF resource into duplicate visual entities"
    status: "confirmed_fixed"
    root_cause: "Projection identities used only the root base and suppressed mappings after the incorrect key had already been created."
    resolution: "Node identities resolve every ancestor and element xml:base in document order, and subclass resources resolve their own element base before semantic indexing."
    evidence: "A nested ../model/ Thing declaration coalesces with ../model/Thing into one authoritative mapped entity, and inherited domain/range resources resolve to mapped endpoints."
  - finding: "Catalogue validation rejected inert DOCTYPE text"
    status: "confirmed_fixed"
    root_cause: "The catalogue path retained a raw DOCTYPE/ENTITY substring regex after runtime parsing moved to tokenized declaration detection."
    resolution: "Catalogue validation reuses the bounded SAX prolog preflight and reports only actual DOCTYPE declarations as active XML."
    evidence: "Catalogue tests reject a real declaration while accepting identical text in an XML comment and CDATA."
  - finding: "Successful authored sharing invalidated its own route guard"
    status: "confirmed_fixed"
    root_cause: "The request compared the actual post-replaceState route with an immutable initiating route captured from stale rendered router state."
    resolution: "Each request starts from the actual current route and explicitly accepts only the share route transition it performs itself."
    evidence: "A successful authored share reaches Copied state and a second share completes instead of remaining at Encoding."
  - finding: "XML-literal preprocessing could amplify memory before dataset budgets"
    status: "confirmed_fixed"
    root_cause: "The independent XML-literal extraction pass reconstructed complete fragments before expanded-term, total-output, or event budgets applied."
    resolution: "Reconstruction computes escaped tag lengths before allocation and incrementally enforces per-literal, cumulative-output, and event limits for tags, text, comments, CDATA, and processing instructions."
    evidence: "A 20,210-character long-namespace fixture rejects in 8.9 ms with about 1.14 MiB heap growth at the 16,384-character XML-literal limit."
  - finding: "One edited RDF literal could leave dependent visual fields stale"
    status: "confirmed_fixed"
    root_cause: "Patch projection mappings advanced atomically, but Designer actions updated only the field that initiated the shared-statement edit."
    resolution: "The same history transaction now synchronizes ontology, entity, and association fields whose exact literal mappings changed."
    evidence: "A resource typed as both owl:Ontology and owl:Class can be renamed from either visual role repeatedly without stale fields or lost editability."
  - finding: "An imported document on a catalogue route could share the previous catalogue link"
    status: "confirmed_fixed"
    root_cause: "Header selected a short link from the route alone before considering the active catalogue entry and source document."
    resolution: "Short catalogue links require the route, active entry, and any active RDF source catalogue identity to agree; otherwise source-backed sharing downloads the active complete RDF."
    evidence: "An imported source displayed on a stale catalogue hash downloads its own RDF and never writes the old deep link to the clipboard."
  - finding: "XML encoding declarations could disagree with authoritative source bytes"
    status: "confirmed_fixed"
    root_cause: "Decoding selected UTF-16 only from a BOM and otherwise assumed UTF-8 without validating the leading XML declaration."
    resolution: "Decoding recognizes UTF-8 BOM and UTF-16 BOM/byte signatures, accepts only UTF-8/UTF-16 declarations, and rejects unsupported or byte-conflicting declarations."
    evidence: "BOM-less UTF-16 decodes correctly; ISO-8859-1 and UTF-8-BOM/UTF-16 conflicts fail explicitly while untouched valid UTF-16 bytes still export exactly."
  - finding: "Designer encoding normalization could mutate processing instructions"
    status: "confirmed_fixed"
    root_cause: "A document-wide XML-like regex rewrote the first encoding attribute even when it belonged to an XMLLiteral processing instruction."
    resolution: "Normalization is anchored to an actual leading XML declaration after an optional BOM and never scans document content."
    evidence: "An unrelated label edit preserves an xml-model processing instruction with encoding=\"ISO-8859-1\" inside an XML literal."
  - finding: "Designer renders repeatedly materialized and indexed complete graphs"
    status: "confirmed_fixed"
    root_cause: "Editability probes simulated patches and the statement count independently materialized the full dataset on every render."
    resolution: "One WeakMap cache per immutable document revision stores materialized quads and their key index; editability performs an exact indexed mapping check and counts reuse the cached length."
    evidence: "Two editability checks and a statement-count query invoke materialization once for a document revision."
  - finding: "Designer dirty-state checks still rescanned complete graphs"
    status: "confirmed_fixed"
    root_cause: "isRdfDocumentDirty independently rebuilt original keys, copied materialized quads, and re-keyed every statement on each toolbar render."
    resolution: "The immutable-document materialization cache now computes net dirty state once alongside quads and their key index."
    evidence: "Repeated editability, count, and dirty-state calls for one document revision invoke materialization exactly once."
  - finding: "Catalogue embeds blocked graph rendering on optional source retrieval"
    status: "confirmed_fixed"
    root_cause: "The catalogue load path awaited the complete RDF artifact before publishing the already verified visual payload."
    resolution: "The graph renders after index/payload verification; opening the RDF tab starts one guarded source request, and source errors remain in that tab with explicit generated RDF fallback."
    evidence: "The initial catalogue graph performs only index and payload requests; a failed source request leaves the graph interactive and reports the failure above generated RDF."
  - finding: "RDF 1.2 directional literals collapsed and were downgraded"
    status: "confirmed_fixed"
    root_cause: "The adapter omitted RDF/JS literal direction from its internal type, quad identity, budgets, and writer."
    resolution: "Direction is retained as exact literal identity, counted in budgets, carried through patches, and serialized with RDF 1.2 plus ITS direction syntax."
    evidence: "Independently expected ltr/rtl statements remain distinct after parsing and after an unrelated mapped edit/export."
  - finding: "Inherited namespace copying amplified memory quadratically"
    status: "confirmed_fixed"
    root_cause: "Both SAX integration passes cloned a complete namespace map on every element even though resolved SAX tags already carried the required namespace data."
    resolution: "The unused maps were replaced with constant-space depth counters while XMLLiteral output-scope tracking remains intact."
    evidence: "The 45,956-character fixture improved from 195 ms / 313 MB maximum RSS to 31.8 ms / 99 MB, and a scaling regression passes."
  - finding: "Lazy embeds could pair payload and source from different catalogue versions"
    status: "confirmed_fixed"
    root_cause: "The embed discarded the loaded entry and later resolved source metadata again by catalogue ID, including stale-index refresh."
    resolution: "The embed retains the exact loaded entry and requests only its content-addressed source artifact; unavailability surfaces locally with generated RDF fallback."
    evidence: "A two-version catalogue regression proves the old source 404 does not refresh the index or display the newer source."
  - finding: "Node 20 Web Crypto rejected VM-realm RDF byte buffers"
    status: "confirmed_fixed"
    root_cause: "Node 20's Web Crypto BufferSource conversion rejects ArrayBuffers constructed inside Vitest's isolated VM realm."
    resolution: "Source bytes are copied into an ArrayBuffer created by the same-realm TextEncoder implementation before hashing."
    evidence: "An explicit cross-realm regression, 35 focused UTF-16/preview tests, and the full 937-test suite pass under Node 20."
  - finding: "Concurrent catalogue compilation exceeded the CI-only test timeout"
    status: "confirmed_fixed"
    root_cause: "The end-to-end test's 60-second subprocess cap was too close to the real compiler's runtime on a contended two-core CI runner."
    resolution: "The redundant end-to-end test allows 120 seconds; the dedicated CI compile step remains independently blocking and unchanged."
    evidence: "The catalogue test passes both alone and alongside 102 source/preview tests under Node 20."

